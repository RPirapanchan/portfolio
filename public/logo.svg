<svg width="160" height="80" viewBox="0 0 160 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="120%">
      <stop offset="0%"   stop-color="#8a8a8a"/>
      <stop offset="25%"  stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#b0b0b0"/>
      <stop offset="75%"  stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#111111" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
    </style>
  </defs>

  <text x="43" y="58" font-family="'Playfair Display', Georgia, serif"
        font-size="64" font-weight="700" fill="url(#shadow)"
        transform="translate(2.5,2.5)" letter-spacing="-2">R</text>
  <text x="78" y="58" font-family="'Playfair Display', Georgia, serif"
        font-size="64" font-weight="700" fill="url(#shadow)"
        transform="translate(2.5,2.5)" letter-spacing="-2">P</text>

  <text x="41" y="58" font-family="'Playfair Display', Georgia, serif"
        font-size="64" font-weight="700" fill="url(#silverGradient)"
        filter="url(#silverGlow)" letter-spacing="-2">R</text>
  <text x="76" y="58" font-family="'Playfair Display', Georgia, serif"
        font-size="64" font-weight="700" fill="url(#silverGradient)"
        filter="url(#silverGlow)" letter-spacing="-2">P</text>

  <line x1="18" y1="68" x2="62" y2="68" stroke="#b0b0b0" stroke-width="0.8" stroke-opacity="0.6"/>
  <circle cx="80" cy="68" r="2" fill="#ffffff" fill-opacity="0.85"/>
  <line x1="98" y1="68" x2="142" y2="68" stroke="#b0b0b0" stroke-width="0.8" stroke-opacity="0.6"/>
</svg>
